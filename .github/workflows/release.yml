name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The extension reports the package.json version, so a mismatched tag
      # would publish a .vsix that claims a different version than the release.
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      # Installs node and rite pinned in .mise.toml, matching local dev.
      - uses: jdx/mise-action@v3.6.1

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: rite test

      # One universal .vsix: QuickDiff ships no native binaries.
      - name: Package extension
        run: rite package

      - name: Generate checksums
        run: sha256sum quickdiff-*.vsix > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            quickdiff-*.vsix
            checksums.txt
